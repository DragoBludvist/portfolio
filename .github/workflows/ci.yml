name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # --ignore-scripts: dependencies can't run install hooks in CI (supply-chain hardening).
      # Nothing in this project needs them; Vite's native binaries ship as plain packages.
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run build
